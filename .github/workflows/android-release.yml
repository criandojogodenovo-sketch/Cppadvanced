name: Android Release Build

# Build de release: manual ou por tag (ex.: v0.3.0)
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # necessário para criar a GitHub Release

jobs:
  release:
    name: APK release + publicação
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Permissões do wrapper
        run: chmod +x gradlew

      - name: Testes unitários
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # Assinatura: usa keystore de PRODUÇÃO dos segredos se existirem (docs/BUILD.md);
      # caso contrário gera keystore de CI — APK instalável para testes.
      # Nota: contexto `secrets` não é permitido em `if:` de steps (workflow inválido),
      # por isso a decisão é feita aqui dentro, via env.
      - name: Preparar keystore (produção via segredos, ou CI)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "STUDIO_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
              echo "STUDIO_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "STUDIO_KEY_ALIAS=$KEY_ALIAS"
              echo "STUDIO_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "A usar keystore de PRODUÇÃO (segredos do repositório)"
          else
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -dname "CN=Cpp Mobile Studio CI, OU=CI, O=CppStudio, L=Luanda, C=AO"
            echo "Sem segredos de produção — gerado keystore de CI (APK para testes)"
          fi

      - name: Compilar APK debug + release
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Publicar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Criar GitHub Release (apenas em tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            app/build/outputs/apk/debug/*.apk \
            app/build/outputs/apk/release/*.apk
