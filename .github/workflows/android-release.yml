name: Android Release Build

# Build de release: manual ou por tag (ex.: v0.3.0)
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # necessário para criar a GitHub Release

jobs:
  release:
    name: APK release + publicação
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Permissões do wrapper
        run: chmod +x gradlew

      - name: Testes unitários
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # Assinatura de PRODUÇÃO (opcional): usa segredos se existirem — docs/BUILD.md
      - name: Descodificar keystore de produção
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "STUDIO_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "STUDIO_KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "STUDIO_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "STUDIO_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      # Sem segredos: keystore de CI gerado no momento — APK instalável para testes
      - name: Gerar keystore de CI
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Cpp Mobile Studio CI, OU=CI, O=CppStudio, L=Luanda, C=AO"

      - name: Compilar APK debug + release
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Publicar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Criar GitHub Release (apenas em tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            app/build/outputs/apk/debug/*.apk \
            app/build/outputs/apk/release/*.apk
